name: Publish checked RAM optimization source
on:
  push:
    branches: [perf/flash-backed-ram-20260920]
    paths: [.github/workflows/ram-source-once.yml]
permissions:
  contents: write
jobs:
  publish:
    if: github.repository == 'ytyisme/STM32Tools' && github.ref == 'refs/heads/perf/flash-backed-ram-20260920' && github.actor == 'ytyisme'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Apply exact tested delta without running project code or changing master
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, lzma, os, subprocess
          from pathlib import Path
          REPO='ytyisme/STM32Tools'
          BRANCH='refs/heads/perf/flash-backed-ram-20260920'
          BASE='1e3a8a8e005e5641a34f36989154ec24c7a32cfa'
          TREE='32120fb7110b11f915d45ada12c5785f01782166'
          HASH='1a69dfd69acab0b1a20b780f9cc5803706f6d5c0c3d23c34ec59cf02d8a310f9'
          FILE='.ci/ram-opt.payload.b64'
          SELF='.github/workflows/ram-source-once.yml'
          def git(*args, env=None, input=None):
              return subprocess.check_output(['git',*args],env=env,input=input).decode().strip()
          def require(ok,message):
              if not ok: raise SystemExit(message)
          require(os.environ['GITHUB_REPOSITORY']==REPO and os.environ['GITHUB_REF']==BRANCH and os.environ['GITHUB_ACTOR']=='ytyisme','Wrong scope')
          head=git('rev-parse','HEAD')
          require(head==os.environ['GITHUB_SHA'] and not git('status','--porcelain'),'Changed checkout')
          require(git('rev-parse','origin/master')==BASE,'Master changed; review required')
          git('merge-base','--is-ancestor',BASE,head)
          require(set(git('diff','--name-only',BASE,head).splitlines())=={FILE,SELF},'Unexpected feature changes')
          compressed=base64.b64decode(Path(FILE).read_text().strip(),validate=True)
          require(hashlib.sha256(compressed).hexdigest()==HASH,'Payload hash mismatch')
          decoder=lzma.LZMADecompressor(memlimit=64*1024*1024)
          raw=decoder.decompress(compressed,max_length=2_000_000)
          require(decoder.eof and not decoder.unused_data,'Invalid payload')
          payload=json.loads(raw)
          require(payload['schema']==1 and payload['repository']==REPO and payload['base']==BASE and payload['tree']==TREE,'Wrong revisions')
          env=dict(os.environ,GIT_INDEX_FILE=str(Path(os.environ['RUNNER_TEMP'])/'ram-source.index'))
          git('read-tree',BASE,env=env)
          patch=payload['patch'].encode('utf8')
          git('apply','--cached','--check','--whitespace=nowarn','-',env=env,input=patch)
          git('apply','--cached','--whitespace=nowarn','-',env=env,input=patch)
          require(git('write-tree',env=env)==TREE,'Source tree mismatch')
          # Preserve existing workflows for this contents-only push. The authorized
          # repository API removes this one-time helper after checking the tree.
          github_tree=git('rev-parse',head+':.github')
          entries=git('ls-tree',TREE).splitlines()
          require(sum(line.endswith('\t.github') for line in entries)==1,'Invalid root tree')
          entries=['040000 tree '+github_tree+'\t.github' if line.endswith('\t.github') else line for line in entries]
          staging=git('mktree',input=('\n'.join(entries)+'\n').encode())
          require(not git('diff','--name-only',head,staging,'--','.github'),'Workflow change forbidden')
          git('config','user.name','github-actions[bot]')
          git('config','user.email','41898282+github-actions[bot]@users.noreply.github.com')
          commit=git('commit-tree',staging,'-p',head,'-m','perf: add bounded log streaming and native-page ST7305 rendering')
          require(git('ls-remote','--heads','origin',BRANCH).split()[0]==head,'Feature branch changed')
          git('push','origin',commit+':'+BRANCH)
          print('Source commit:',commit)
          print('Verified final tree:',TREE)
          PY
