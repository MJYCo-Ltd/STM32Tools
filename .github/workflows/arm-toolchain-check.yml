name: ARM toolchain validation setup
on:
  pull_request:
permissions:
  contents: read
jobs:
  compiler:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Obtain distro ARM C compiler and runtime for isolated validation
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          mkdir compiler-packages
          cd compiler-packages
          apt-get download gcc-arm-none-eabi binutils-arm-none-eabi libnewlib-arm-none-eabi libnewlib-dev
          sha256sum *.deb > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: arm-compiler-packages
          path: compiler-packages/
          retention-days: 3
          compression-level: 0
          if-no-files-found: error
