name: Publish verified branch integration
on:
  push:
    branches: [fix/branch-integration-20260919]
    paths: [.github/workflows/apply-branch-integration.yml]
permissions:
  contents: write
jobs:
  publish:
    if: github.repository == 'ytyisme/STM32Tools' && github.ref == 'refs/heads/fix/branch-integration-20260919' && github.actor == 'ytyisme'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Verify exact source tree, test it, and fast-forward only the integration branch
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, lzma, os, subprocess
          from pathlib import Path
          BRANCH='refs/heads/fix/branch-integration-20260919'
          BOOTSTRAP='64def0725a90439b4f18000abcd9cf3317cc24d2'
          BASE='7532b6c8af3a27a44e1469974714e708f701283e'
          AUDIT='06cc5e4e400aa405d55a6816dc428cf1d6b8c5c3'
          TREE='9f508b495fcc81e53c8a059b9226611a5a7e757e'
          HASH='21ea64f46009377b6cee93d30e8f0d1f8222925ca3a82552902a300cb27539c7'
          PARTS=['.ci/branch-integration/part'+str(i)+'.b64' for i in range(4)]
          SELF='.github/workflows/apply-branch-integration.yml'
          def git(*args, env=None, input=None):
              return subprocess.check_output(['git',*args],env=env,input=input).decode().strip()
          def require(ok,message):
              if not ok: raise SystemExit(message)
          require(os.environ['GITHUB_REPOSITORY']=='ytyisme/STM32Tools','Wrong repository')
          require(os.environ['GITHUB_REF']==BRANCH and os.environ['GITHUB_ACTOR']=='ytyisme','Wrong branch or actor')
          head=git('rev-parse','HEAD')
          require(head==os.environ['GITHUB_SHA'] and not git('status','--porcelain'),'Checkout changed')
          git('merge-base','--is-ancestor',BOOTSTRAP,head)
          changed=set(git('diff','--name-only',BOOTSTRAP,head).splitlines())
          require(changed==set(PARTS+[SELF]),'Unexpected changes on integration branch')
          sources={'master':'a39693e408cb069beb6cb73d0a6d8ca662426413','fix/consolidated-engineering':BASE,'fix/audit-consolidated':AUDIT,'fix/consolidated-runtime-boundaries':'300249ddc929da3ba7ac64f90c39a0862104dd7f'}
          for ref,sha in sources.items():
              require(git('rev-parse','origin/'+ref)==sha,'Source branch moved: '+ref)
          compressed=base64.b64decode(''.join(Path(p).read_text().strip() for p in PARTS),validate=True)
          require(hashlib.sha256(compressed).hexdigest()==HASH,'Payload hash mismatch')
          decoder=lzma.LZMADecompressor(memlimit=256*1024*1024)
          raw=decoder.decompress(compressed,max_length=2_000_000)
          require(decoder.eof and not decoder.unused_data,'Invalid or oversized payload')
          payload=json.loads(raw)
          require(payload['schema']==1 and payload['repository']=='ytyisme/STM32Tools','Wrong payload')
          require(payload['base']==BASE and payload['tree']==TREE and payload['parents']==[BASE,AUDIT],'Wrong source revisions')
          evidence=Path(os.environ['RUNNER_TEMP'])/'integration-evidence'
          evidence.mkdir()
          env=dict(os.environ,GIT_INDEX_FILE=str(evidence/'index'))
          git('read-tree',BASE,env=env)
          patch=payload['patch'].encode('utf8')
          git('apply','--cached','--check','--whitespace=nowarn','-',env=env,input=patch)
          git('apply','--cached','--whitespace=nowarn','-',env=env,input=patch)
          require(git('write-tree',env=env)==TREE,'Result differs from tested source tree')
          git('config','user.name','github-actions[bot]')
          git('config','user.email','41898282+github-actions[bot]@users.noreply.github.com')
          candidate=git('commit-tree',TREE,'-p',head,'-p',BASE,'-p',AUDIT,'-m','fix: merge engineering and audit branches with tested runtime compatibility')
          source=Path(os.environ['RUNNER_TEMP'])/'integrated-source'
          build=Path(os.environ['RUNNER_TEMP'])/'integrated-host-build'
          git('worktree','add','--detach',str(source),candidate)
          commands=[['cmake','-S',str(source/'Test'),'-B',str(build),'-G','Ninja','-DCMAKE_BUILD_TYPE=Release'],['cmake','--build',str(build),'--parallel','2'],['ctest','--test-dir',str(build),'--output-on-failure','--output-junit',str(evidence/'tests.xml')]]
          for i,cmd in enumerate(commands):
              with (evidence/('test-'+str(i)+'.log')).open('w') as log:
                  subprocess.run(cmd,stdout=log,stderr=subprocess.STDOUT,check=True)
          require(git('ls-remote','--heads','origin',BRANCH).split()[0]==head,'Integration branch moved; refusing overwrite')
          git('push','origin',candidate+':'+BRANCH)
          git('update-ref','refs/heads/integration-evidence',candidate)
          git('bundle','create',str(evidence/'STM32Tools-integrated.bundle'),'refs/heads/integration-evidence')
          (evidence/'revision.json').write_text(json.dumps({'repository':'ytyisme/STM32Tools','branch':BRANCH,'commit':candidate,'tree':TREE,'parents':[head,BASE,AUDIT]},indent=2)+'\n')
          (evidence/'index').unlink()
          print('Published integration commit:',candidate)
          print('Verified source tree:',TREE)
          PY
      - name: Keep short-lived integration evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: integrated-source
          path: ${{ runner.temp }}/integration-evidence
          retention-days: 1
