name: Audit source snapshot
on:
  push:
    branches: [fix/audit-consolidated]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: git archive --format=zip HEAD -o "${RUNNER_TEMP}/STM32Tools.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: audit-source
          path: ${{ runner.temp }}/STM32Tools.zip
          retention-days: 1
