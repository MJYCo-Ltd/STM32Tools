name: Apply verified audit changes
on:
  push:
    branches: [fix/audit-consolidated]
    paths: [.github/workflows/apply-audit.yml]
permissions:
  contents: write
jobs:
  apply:
    if: github.repository == 'ytyisme/STM32Tools' && github.ref == 'refs/heads/fix/audit-consolidated'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify all old and new blob hashes then publish without force
        run: python3 .audit-transfer/publish.py ytyisme/STM32Tools e4e7279b5a11975306f471e293b667edbb35e576b9cf069058a79804e897f5a6
